[package]
name = "xetcore_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# xet-core engine (git submodule, pinned to v1.5.1).
# Crate package names use hyphens; imported in Rust as `xet_data` / `xet_runtime`.
xet_data = { package = "xet-data", path = "xet-core/xet_data" }
xet_runtime = { package = "xet-runtime", path = "xet-core/xet_runtime" }
xet_client = { package = "xet-client", path = "xet-core/xet_client" }  # AuthConfig for remote uploads

# Error handling and JSON result marshalling across the FFI boundary.
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# File logging for xet-core's `tracing` output.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

[build-dependencies]
csbindgen = "1.9.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# NOTE: must stay "unwind" (the default). The FFI shim relies on
# std::panic::catch_unwind to stop Rust panics from crossing into the CLR;
# `panic = "abort"` would defeat that and hard-kill the .NET host process.
panic = "unwind"
strip = true
