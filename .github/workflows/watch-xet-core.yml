# Watches huggingface/xet-core for newly-added tags and opens an issue when one appears
# (a GitHub issue notifies the repo owner by email/notification — that's the "message me").
# State (tags already seen) is kept in .github/xet-core-tags.txt; on the first run it just
# seeds that file WITHOUT alerting, so you only hear about tags added from now on.
name: watch-xet-core

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 08:00 UTC
  workflow_dispatch:       # allow a manual check from the Actions tab

permissions:
  contents: write   # commit the updated seen-tags state
  issues: write     # open an issue when a new tag appears

concurrency:
  group: watch-xet-core
  cancel-in-progress: false

# Run JS actions on Node 24 (see the Node 20 deprecation changelog, 2025-09-19).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect new xet-core tags
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: huggingface/xet-core
        run: |
          set -euo pipefail
          state=.github/xet-core-tags.txt

          # All upstream tag names (paginated), sorted & de-duplicated.
          gh api --paginate "repos/$UPSTREAM/tags" --jq '.[].name' | sort -u > /tmp/current.txt
          echo "upstream has $(wc -l < /tmp/current.txt) tags"

          if [ ! -f "$state" ]; then
            echo "First run: seeding state, no alert."
            cp /tmp/current.txt "$state"
            exit 0
          fi

          new=$(comm -23 /tmp/current.txt <(sort -u "$state") || true)
          if [ -z "$new" ]; then
            echo "No new tags."
            exit 0
          fi

          echo "New tag(s):"; echo "$new"
          list=$(echo "$new" | sed 's/^/- /')
          body=$(printf 'huggingface/xet-core published new tag(s):\n\n%s\n\nCurrent submodule pin: **v1.5.1**. Review the changes and consider bumping the `xet-core` submodule.\n\nAll tags: https://github.com/%s/tags' "$list" "$UPSTREAM")
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "xet-core: new tag(s) detected" \
            --body "$body"

          cp /tmp/current.txt "$state"

      - name: Commit updated state
        run: |
          set -euo pipefail
          # Stage first so a brand-new (untracked) seed file is detected too —
          # `git diff` alone only sees tracked files.
          git add .github/xet-core-tags.txt
          if git diff --cached --quiet; then
            echo "State unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # skip-ci marker keeps this bookkeeping commit from triggering the build workflow.
          git commit -m "chore(bot): update seen xet-core tags [skip ci]"
          git push
