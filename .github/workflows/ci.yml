name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Run every JS action on Node 24 instead of the deprecated Node 20 runtime, without
# churning each action's version. Per GitHub's Node 20 deprecation changelog (2025-09-19):
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Build the native xetcore_native library for every target.
  #   Linux runner:   linux-x64 (native), linux-arm64 (cargo-zigbuild).
  #   Windows runner: win-x64 (native MSVC), win-arm64 (cross MSVC).
  #   macOS runner:   osx-arm64 + osx-x64 (native, both SDKs present on the runner).
  # Each job uploads its native binary AND its build log (log/error always uploaded).
  # ---------------------------------------------------------------------------
  native:
    name: native-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64,   triple: x86_64-unknown-linux-gnu,  tool: cargo,    lib: libxetcore_native.so }
          - { os: ubuntu-latest,  rid: linux-arm64, triple: aarch64-unknown-linux-gnu, tool: zigbuild, lib: libxetcore_native.so }
          - { os: windows-latest, rid: win-x64,     triple: x86_64-pc-windows-msvc,    tool: cargo,    lib: xetcore_native.dll }
          - { os: windows-latest, rid: win-arm64,   triple: aarch64-pc-windows-msvc,   tool: cargo,    lib: xetcore_native.dll }
          - { os: macos-latest,   rid: osx-arm64,   triple: aarch64-apple-darwin,      tool: cargo,    lib: libxetcore_native.dylib }
          - { os: macos-latest,   rid: osx-x64,     triple: x86_64-apple-darwin,       tool: cargo,    lib: libxetcore_native.dylib }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rid }}

      - name: Ensure cmake (for aws-lc-sys)
        shell: bash
        run: cmake --version || (command -v brew && brew install cmake) || (sudo apt-get update && sudo apt-get install -y cmake)

      - name: Install NASM (Windows, required by aws-lc-sys/MSVC)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install cargo-zigbuild + zig
        if: matrix.tool == 'zigbuild'
        shell: bash
        run: |
          python3 -m pip install --user ziglang || python3 -m pip install --break-system-packages ziglang
          cargo install cargo-zigbuild --locked

      - name: Build (release)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          if [ "${{ matrix.tool }}" = "zigbuild" ]; then
            cargo zigbuild --release --target ${{ matrix.triple }} 2>&1 | tee logs/build-${{ matrix.rid }}.log
          else
            cargo build   --release --target ${{ matrix.triple }} 2>&1 | tee logs/build-${{ matrix.rid }}.log
          fi

      - name: Upload native binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: target/${{ matrix.triple }}/release/${{ matrix.lib }}
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-build-${{ matrix.rid }}
          path: logs/build-${{ matrix.rid }}.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Build the native lib (debug) and run the xUnit v3 interop tests on linux-x64.
  # Uploads test results + logs whether or not the tests pass.
  # ---------------------------------------------------------------------------
  # Runs the FFI interop test suite on every OS/arch we can EXECUTE on hosted runners.
  # Each job builds the host-native debug lib (flat-copied next to the test assembly by
  # XetSharp.csproj) and runs the full xUnit suite through the real P/Invoke boundary.
  # The arm64 runners (ubuntu-24.04-arm, windows-11-arm) are free for PUBLIC repos only.
  test:
    name: test-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest,   rid: win-x64 }
          - { os: windows-11-arm,   rid: win-arm64 }
          - { os: macos-latest,     rid: osx-arm64 }
          - { os: macos-15-intel,   rid: osx-x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.rid }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NASM (Windows, required by aws-lc-sys/MSVC)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Ensure cmake (for aws-lc-sys)
        shell: bash
        run: cmake --version || (command -v brew && brew install cmake) || (sudo apt-get update && sudo apt-get install -y cmake)

      - name: Build native (debug)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          cargo build 2>&1 | tee logs/cargo-build.log

      - name: Run tests
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet test XetSharp.Tests/XetSharp.Tests.csproj -c Release \
            --logger "trx;LogFileName=results.trx" \
            --results-directory testresults 2>&1 | tee logs/dotnet-test.log

      - name: Upload test results + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.rid }}
          path: |
            testresults/**
            logs/**

      - name: Fail job if tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------------
  # Live Hub check: validates the HF_TOKEN secret against the real Hub (whoami-v2).
  # The test self-skips when HF_TOKEN is empty (forks, or before the secret is set),
  # so this job stays green until a valid token is provided, then verifies it for real.
  # Managed-only (no native/cargo needed — whoami does not cross the FFI boundary).
  # ---------------------------------------------------------------------------
  hub-test:
    name: hub-test-live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run live Hub tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: dotnet test Huggingface.Tests/Huggingface.Tests.csproj -c Release

  # ---------------------------------------------------------------------------
  # Gather every native binary and produce the split NuGet package set:
  #   XetSharp (meta) + XetSharp.runtime.<rid> per built RID.
  # ---------------------------------------------------------------------------
  pack:
    name: pack-nuget
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download all native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: _natives   # each artifact lands in _natives/native-<rid>/<lib>

      - name: Stage natives into target/<triple>/release
        shell: bash
        run: |
          set -euo pipefail
          declare -A TRIPLE=(
            [linux-x64]=x86_64-unknown-linux-gnu
            [linux-arm64]=aarch64-unknown-linux-gnu
            [win-x64]=x86_64-pc-windows-msvc
            [win-arm64]=aarch64-pc-windows-msvc
            [osx-x64]=x86_64-apple-darwin
            [osx-arm64]=aarch64-apple-darwin
          )
          for d in _natives/native-*; do
            rid="${d##*/native-}"
            triple="${TRIPLE[$rid]:-}"
            if [ -z "$triple" ]; then echo "::warning::no triple mapping for $rid"; continue; fi
            dst="target/$triple/release"
            mkdir -p "$dst"
            cp "$d"/* "$dst"/
            echo "staged $rid -> $dst/"
          done
          find target -path '*/release/*xetcore_native*' | sort

      - name: Pack
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs artifacts
          dotnet pack XetSharp/XetSharp.csproj -c Release -o artifacts 2>&1 | tee -a logs/pack.log
          for proj in packaging/*/XetSharp.runtime.*.csproj; do
            echo "::group::pack $proj"
            if dotnet pack "$proj" -c Release -o artifacts 2>&1 | tee -a logs/pack.log; then :; \
            else echo "::warning::pack failed for $proj"; fi
            echo "::endgroup::"
          done
          ls -1 artifacts/*.nupkg || true

      - name: Verify every staged RID produced a runtime package
        shell: bash
        run: |
          set -euo pipefail
          staged=$(ls -d _natives/native-* 2>/dev/null | wc -l)
          pkgs=$(ls artifacts/XetSharp.runtime.*.nupkg 2>/dev/null | wc -l)
          echo "staged natives: $staged, runtime packages: $pkgs"
          if [ "$pkgs" -ne "$staged" ]; then
            echo "::error::expected $staged runtime packages, got $pkgs"
            exit 1
          fi

      - name: Upload NuGet packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: warn

      - name: Upload pack log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-pack
          path: logs/pack.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # On a version tag (v*), attach the full NuGet package set to a GitHub Release.
  # Uses the workflow's built-in GITHUB_TOKEN — no extra secrets required.
  # Cut a release with:  git tag v0.1.0 && git push origin v0.1.0
  # ---------------------------------------------------------------------------
  release:
    name: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release + upload assets
    steps:
      - name: Download packed NuGets
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: Create GitHub Release with packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -1 artifacts/*.nupkg
          gh release create "${GITHUB_REF_NAME}" artifacts/*.nupkg \
            --repo "${GITHUB_REPOSITORY}" \
            --title "XetSharp ${GITHUB_REF_NAME}" \
            --generate-notes
